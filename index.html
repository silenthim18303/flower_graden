<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>花园小游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        #game-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #counter-btn {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 1000;
            background: white;
            color: black;
            border: none;
            border-radius: 50px;
            padding: 6px 14px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 5px;
        }
        #counter-btn .icon {
            font-size: 10px;
        }
        #fertilizer-btn {
            position: fixed;
            top: 50px;
            left: 15px;
            z-index: 1000;
            background: white;
            color: black;
            border: none;
            border-radius: 50px;
            padding: 6px 14px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 5px;
        }
        #fertilizer-btn .icon {
            width: 16px;
            height: 16px;
        }
        #seed-btn {
            position: fixed;
            top: 85px;
            left: 15px;
            z-index: 1000;
            background: white;
            color: black;
            border: none;
            border-radius: 50px;
            padding: 6px 14px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 5px;
        }
        #seed-btn .icon {
            width: 16px;
            height: 16px;
        }
        #money-btn {
            position: fixed;
            top: 120px;
            left: 15px;
            z-index: 1000;
            background: white;
            color: black;
            border: none;
            border-radius: 50px;
            padding: 6px 14px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 5px;
        }
        #money-btn .icon {
            width: 16px;
            height: 16px;
        }
        #toolbar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px 3vw;
            gap: 3vw;
            max-width: 95vw;
        }
        .toolbar-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: none;
            border: 2px solid #4CAF50;
            border-radius: 12px;
            padding: 8px 10px;
            cursor: pointer;
            transition: transform 0.1s;
            flex-shrink: 0;
        }
        .toolbar-item:active {
            transform: scale(0.95);
        }
        .toolbar-item img {
            width: 32px;
            height: 32px;
        }
        .toolbar-item span {
            font-size: 12px;
            color: #333;
            font-weight: bold;
            white-space: nowrap;
        }
        .toolbar-item.locked {
            opacity: 0.4;
            cursor: not-allowed;
            border-color: #999;
        }
        .toolbar-item.locked img {
            filter: grayscale(100%);
        }
    </style>
</head>
<body>
    <button id="counter-btn">
        <span class="icon">🌿</span>
        <span id="counter-text">杂草: 0</span>
    </button>
    <button id="fertilizer-btn">
        <img class="icon" src="img/tools/fertilizer.png" alt="肥料">
        <span id="fertilizer-text">肥料: 0</span>
    </button>
    <button id="seed-btn">
        <img class="icon" src="img/tools/随机种子.png" alt="种子">
        <span id="seed-text">种子: 0</span>
    </button>
    <button id="money-btn">
        <img class="icon" src="img/tools/money.png" alt="货币">
        <span id="money-text">货币: 0</span>
    </button>
    <div id="toolbar"></div>
    <div id="game-container"></div>
    <script src="phaser-4.1.0/dist/phaser.js"></script>
    <script src="js/core/gameData.js"></script>
    <script src="js/tools/fertilizer.js"></script>
    <script src="js/core/toolbar.js"></script>
    <script src="js/tools/tree.js"></script>
    <script src="js/bills/work.js"></script>
    <script src="js/bills/mark_bill.js"></script>
    <script src="js/bills/garden_bill.js"></script>
    <script src="js/plants/grass.js"></script>
    <script src="js/plants/orchid.js"></script>
    <script src="js/plants/chrysanthemum.js"></script>
    <script src="js/plants/starflower.js"></script>
    <script src="js/plants/passerbyflower.js"></script>
    <script src="js/scenes/game.js"><script src="js/core/transition.js"></script>
</script>
</body>
</html>
