<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>花园小游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('./img/background/start.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        #progress-container {
            position: absolute;
            top: 70%;
            width: 80%;
            max-width: 400px;
        }
        #progress-bar {
            width: 100%;
            height: 20px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #fff;
        }
        #progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #8BC34A);
            border-radius: 8px;
            transition: width 0.3s ease;
        }
        #progress-text {
            text-align: center;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        #game-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #counter-btn {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 1000;
            background: white;
            color: black;
            border: none;
            border-radius: 50px;
            padding: 6px 14px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 5px;
        }
        #counter-btn .icon {
            font-size: 10px;
        }
        #fertilizer-btn {
            position: fixed;
            top: 50px;
            left: 15px;
            z-index: 1000;
            background: white;
            color: black;
            border: none;
            border-radius: 50px;
            padding: 6px 14px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 5px;
        }
        #fertilizer-btn .icon {
            width: 16px;
            height: 16px;
        }
        #seed-btn {
            position: fixed;
            top: 85px;
            left: 15px;
            z-index: 1000;
            background: white;
            color: black;
            border: none;
            border-radius: 50px;
            padding: 6px 14px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 5px;
        }
        #seed-btn .icon {
            width: 16px;
            height: 16px;
        }
        #money-btn {
            position: fixed;
            top: 120px;
            left: 15px;
            z-index: 1000;
            background: white;
            color: black;
            border: none;
            border-radius: 50px;
            padding: 6px 14px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 5px;
        }
        #money-btn .icon {
            width: 16px;
            height: 16px;
        }
        #toolbar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px 3vw;
            gap: 3vw;
            max-width: 95vw;
        }
        .toolbar-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: none;
            border: 2px solid #4CAF50;
            border-radius: 12px;
            padding: 8px 10px;
            cursor: pointer;
            transition: transform 0.1s;
            flex-shrink: 0;
        }
        .toolbar-item:active {
            transform: scale(0.95);
        }
        .toolbar-item img {
            width: 32px;
            height: 32px;
        }
        .toolbar-item span {
            font-size: 12px;
            color: #333;
            font-weight: bold;
            white-space: nowrap;
        }
        .toolbar-item.locked {
            opacity: 0.4;
            cursor: not-allowed;
            border-color: #999;
        }
        .toolbar-item.locked img {
            filter: grayscale(100%);
        }

        /* 重玩教程按钮 */
        #replay-tutorial-btn {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1001;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 18px;
            padding: 6px 16px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(102, 126, 234, 0.4);
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        #replay-tutorial-btn:hover {
            transform: translateX(-50%) scale(1.05);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        #replay-tutorial-btn:active {
            transform: translateX(-50%) scale(0.98);
        }
    </style>
</head>
<body>
    <a href="tutorial.html" id="replay-tutorial-btn">📖 新手教程</a>
    <div id="loading-screen">
        <div id="progress-container">
            <div id="progress-bar">
                <div id="progress-fill"></div>
            </div>
            <div id="progress-text">加载中... 0%</div>
        </div>
    </div>
    <button id="counter-btn">
        <span class="icon">🌿</span>
        <span id="counter-text">杂草: 0</span>
    </button>
    <button id="fertilizer-btn">
        <img class="icon" src="./img/tools/fertilizer.png" alt="肥料">
        <span id="fertilizer-text">肥料: 0</span>
    </button>
    <button id="seed-btn">
        <img class="icon" src="./img/tools/随机种子.png" alt="种子">
        <span id="seed-text">种子: 0</span>
    </button>
    <button id="money-btn">
        <img class="icon" src="./img/tools/money.png" alt="货币">
        <span id="money-text">货币: 0</span>
    </button>
    <div id="toolbar"></div>
    <div id="game-container"></div>
    <script src="./phaserjs/phaser.js"></script>
    <script src="./js/utils/transition.js"></script>
    <script src="./main.js"></script>
    <script>
        // 初始化页面过渡效果
        window.addEventListener('DOMContentLoaded', () => {
            PageTransition.init();
        });
    </script>
</body>
</html>
