<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>电商</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            background-color: #ffffff;
        }
        #counter-btn {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 1000;
            background: white;
            color: black;
            border: none;
            border-radius: 50px;
            padding: 6px 14px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 5px;
        }
        #counter-btn .icon {
            font-size: 10px;
        }
        #fertilizer-btn {
            position: fixed;
            top: 50px;
            left: 15px;
            z-index: 1000;
            background: white;
            color: black;
            border: none;
            border-radius: 50px;
            padding: 6px 14px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 5px;
        }
        #fertilizer-btn .icon {
            width: 16px;
            height: 16px;
        }
        #seed-btn {
            position: fixed;
            top: 85px;
            left: 15px;
            z-index: 1000;
            background: white;
            color: black;
            border: none;
            border-radius: 50px;
            padding: 6px 14px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 5px;
        }
        #seed-btn .icon {
            width: 16px;
            height: 16px;
        }
        #money-btn {
            position: fixed;
            top: 120px;
            left: 15px;
            z-index: 1000;
            background: white;
            color: black;
            border: none;
            border-radius: 50px;
            padding: 6px 14px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 5px;
        }
        #money-btn .icon {
            width: 16px;
            height: 16px;
        }
        .nav-btn {
            position: fixed;
            bottom: 20px;
            z-index: 1000;
            background: white;
            color: black;
            border: none;
            border-radius: 50px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        #nav-back {
            left: 15px;
        }
        .shop-container {
            width: 90%;
            max-width: 400px;
            margin: 160px auto 20px;
            background: #ffffff;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            border: 1px solid #e0e0e0;
        }
        .shop-title {
            color: #333;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
        }
        .shop-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f8f9fa;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
            border: 1px solid #e9ecef;
        }
        .shop-item-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .shop-item-img {
            width: 40px;
            height: 40px;
            object-fit: contain;
        }
        .shop-item-name {
            color: #333;
            font-size: 16px;
            font-weight: bold;
        }
        .shop-item-price {
            color: #ff6b6b;
            font-size: 14px;
        }
        .shop-item-btn {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .shop-item-btn:active {
            transform: scale(0.95);
        }
        .shop-item-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .flower-card {
            width: 90%;
            max-width: 400px;
            margin: 0 auto 100px;
            background: #ffffff;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            border: 1px solid #e0e0e0;
        }
        .flower-card-title {
            color: #333;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 15px;
        }
        .flower-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .flower-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f8f9fa;
            border-radius: 10px;
            padding: 10px;
            border: 1px solid #e9ecef;
        }
        .flower-item-img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }
        .flower-item-info {
            flex: 1;
        }
        .flower-item-name {
            color: #333;
            font-size: 12px;
            font-weight: bold;
        }
        .flower-item-count {
            color: #ff6b6b;
            font-size: 14px;
            font-weight: bold;
        }
        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            z-index: 3000;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <button id="counter-btn">
        <span class="icon">🌿</span>
        <span id="counter-text">杂草: 0</span>
    </button>
    <button id="fertilizer-btn">
        <img class="icon" src="./img/tools/fertilizer.png" alt="肥料">
        <span id="fertilizer-text">肥料: 0</span>
    </button>
    <button id="seed-btn">
        <img class="icon" src="./img/tools/随机种子.png" alt="种子">
        <span id="seed-text">种子: 0</span>
    </button>
    <button id="money-btn">
        <img class="icon" src="./img/tools/money.png" alt="货币">
        <span id="money-text">货币: 0</span>
    </button>
    <a href="././work.html" id="nav-back" class="nav-btn">返回工坊</a>
    <div class="shop-container">
        <div class="shop-title">购买商店</div>
        <div class="shop-item">
            <div class="shop-item-info">
                <img class="shop-item-img" src="./img/tools/fertilizer.png" alt="肥料">
                <div>
                    <div class="shop-item-name">肥料</div>
                    <div class="shop-item-price">价格: 3金币</div>
                </div>
            </div>
            <button class="shop-item-btn" id="fertilizer-buy">购买</button>
        </div>
        <div class="shop-item">
            <div class="shop-item-info">
                <img class="shop-item-img" src="./img/furniture/桌椅.png" alt="桌椅">
                <div>
                    <div class="shop-item-name">桌椅套装</div>
                    <div class="shop-item-price">价格: 80金币</div>
                </div>
            </div>
            <button class="shop-item-btn" id="table-buy">购买</button>
        </div>
        <div class="shop-item">
            <div class="shop-item-info">
                <img class="shop-item-img" src="./img/furniture/鸟笼.png" alt="鸟笼">
                <div>
                    <div class="shop-item-name">精致鸟笼</div>
                    <div class="shop-item-price">价格: 50金币</div>
                </div>
            </div>
            <button class="shop-item-btn" id="birdcage-buy">购买</button>
        </div>
        <div class="shop-item">
            <div class="shop-item-info">
                <img class="shop-item-img" src="./img/furniture/水池.png" alt="水池">
                <div>
                    <div class="shop-item-name">装饰水池</div>
                    <div class="shop-item-price">价格: 100金币</div>
                </div>
            </div>
            <button class="shop-item-btn" id="pool-buy">购买</button>
        </div>
    </div>
    <div class="shop-container">
        <div class="shop-title">出售商店</div>
        <div class="shop-item">
            <div class="shop-item-info">
                <img class="shop-item-img" src="./img/plants/蝴蝶兰.png" alt="蝴蝶兰">
                <div>
                    <div class="shop-item-name">蝴蝶兰</div>
                    <div class="shop-item-price">兑换: 1金币</div>
                </div>
            </div>
            <button class="shop-item-btn" id="orchid-sell">出售</button>
        </div>
        <div class="shop-item">
            <div class="shop-item-info">
                <img class="shop-item-img" src="./img/plants/菊花.png" alt="菊花">
                <div>
                    <div class="shop-item-name">菊花</div>
                    <div class="shop-item-price">兑换: 5金币</div>
                </div>
            </div>
            <button class="shop-item-btn" id="chrysanthemum-sell">出售</button>
        </div>
        <div class="shop-item">
            <div class="shop-item-info">
                <img class="shop-item-img" src="./img/plants/星月相随.png" alt="星月相随">
                <div>
                    <div class="shop-item-name">星月相随</div>
                    <div class="shop-item-price">兑换: 10金币</div>
                </div>
            </div>
            <button class="shop-item-btn" id="starflower-sell">出售</button>
        </div>
        <div class="shop-item">
            <div class="shop-item-info">
                <img class="shop-item-img" src="./img/plants/过路黄.png" alt="过路黄">
                <div>
                    <div class="shop-item-name">过路黄</div>
                    <div class="shop-item-price">兑换: 10金币</div>
                </div>
            </div>
            <button class="shop-item-btn" id="passerbyflower-sell">出售</button>
        </div>
    </div>
    <div class="flower-card">
        <div class="flower-card-title">我的花朵</div>
        <div class="flower-grid">
            <div class="flower-item">
                <img class="flower-item-img" src="./img/plants/蝴蝶兰.png" alt="蝴蝶兰">
                <div class="flower-item-info">
                    <div class="flower-item-name">蝴蝶兰</div>
                    <div class="flower-item-count" id="orchid-count">0</div>
                </div>
            </div>
            <div class="flower-item">
                <img class="flower-item-img" src="./img/plants/菊花.png" alt="菊花">
                <div class="flower-item-info">
                    <div class="flower-item-name">菊花</div>
                    <div class="flower-item-count" id="chrysanthemum-count">0</div>
                </div>
            </div>
            <div class="flower-item">
                <img class="flower-item-img" src="./img/plants/星月相随.png" alt="星月相随">
                <div class="flower-item-info">
                    <div class="flower-item-name">星月相随</div>
                    <div class="flower-item-count" id="starflower-count">0</div>
                </div>
            </div>
            <div class="flower-item">
                <img class="flower-item-img" src="./img/plants/过路黄.png" alt="过路黄">
                <div class="flower-item-info">
                    <div class="flower-item-name">过路黄</div>
                    <div class="flower-item-count" id="passerbyflower-count">0</div>
                </div>
            </div>
        </div>
    </div>
    <div class="toast" id="toast"></div>
    <script src="./js/core/gameData.js"></script>
    <script src="./js/core/toolbar.js"></script>
    <script src="./js/plants/grass.js"></script>
    <script src="./js/tools/fertilizer.js"></script>
    <script>
        function showToast(message) {
            var toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(function() {
                toast.classList.remove('show');
            }, 1500);
        }

        function updateAllDisplays() {
            updateGrassDisplay();
            updateFertilizerDisplay();
            updateSeedDisplay();
            updateMoneyDisplay();
            updateFlowerCounts();
        }

        function updateGrassDisplay() {
            var count = GameData.getGrassCount();
            var grassText = document.getElementById('counter-text');
            if (grassText) {
                grassText.textContent = '杂草: ' + count;
            }
        }

        function updateFlowerCounts() {
            var orchidCount = GameData.getOrchidCount();
            var chrysanthemumCount = GameData.getChrysanthemumCount();
            var flowerCollection = GameData.getFlowerCollection();
            var starflowerCount = flowerCollection['starflower'] ? flowerCollection['starflower'].count : 0;
            var passerbyflowerCount = flowerCollection['passerbyflower'] ? flowerCollection['passerbyflower'].count : 0;

            document.getElementById('orchid-count').textContent = orchidCount;
            document.getElementById('chrysanthemum-count').textContent = chrysanthemumCount;
            document.getElementById('starflower-count').textContent = starflowerCount;
            document.getElementById('passerbyflower-count').textContent = passerbyflowerCount;
        }

        function initShop() {
            var fertilizerBuyBtn = document.getElementById('fertilizer-buy');
            var orchidBtn = document.getElementById('orchid-sell');
            var chrysanthemumBtn = document.getElementById('chrysanthemum-sell');
            var starflowerBtn = document.getElementById('starflower-sell');

            fertilizerBuyBtn.addEventListener('click', function() {
                var money = GameData.getMoneyCount();
                if (money < 3) {
                    showToast('金币不足');
                    return;
                }
                GameData.addMoneyCount(-3);
                GameData.addFertilizerCount(1);
                updateAllDisplays();
                showToast('购买成功！获得1包肥料');
            });

            orchidBtn.addEventListener('click', function() {
                var count = GameData.getOrchidCount();
                if (count <= 0) {
                    showToast('蝴蝶兰不足');
                    return;
                }
                GameData.addOrchidCount(-1);
                GameData.addMoneyCount(1);
                updateAllDisplays();
                showToast('出售成功！获得1金币');
            });

            chrysanthemumBtn.addEventListener('click', function() {
                var count = GameData.getChrysanthemumCount();
                if (count <= 0) {
                    showToast('菊花不足');
                    return;
                }
                GameData.addChrysanthemumCount(-1);
                GameData.addMoneyCount(5);
                updateAllDisplays();
                showToast('出售成功！获得5金币');
            });

            starflowerBtn.addEventListener('click', function() {
                var flowerCollection = GameData.getFlowerCollection();
                var count = flowerCollection['starflower'] ? flowerCollection['starflower'].count : 0;
                if (count <= 0) {
                    showToast('星月相随不足');
                    return;
                }
                flowerCollection['starflower'].count--;
                GameData.saveObject('flowerCollection', flowerCollection);
                GameData.addMoneyCount(10);
                updateAllDisplays();
                showToast('出售成功！获得10金币');
            });

            var passerbyflowerBtn = document.getElementById('passerbyflower-sell');
            if (passerbyflowerBtn) {
                passerbyflowerBtn.addEventListener('click', function() {
                    var flowerCollection = GameData.getFlowerCollection();
                    var count = flowerCollection['passerbyflower'] ? flowerCollection['passerbyflower'].count : 0;
                    if (count <= 0) {
                        showToast('过路黄不足');
                        return;
                    }
                    flowerCollection['passerbyflower'].count--;
                    GameData.saveObject('flowerCollection', flowerCollection);
                    GameData.addMoneyCount(10);
                    updateAllDisplays();
                    showToast('出售成功！获得10金币');
                });
            }

            var tableBuyBtn = document.getElementById('table-buy');
            if (tableBuyBtn) {
                if (GameData.isTableUnlocked()) {
                    tableBuyBtn.disabled = true;
                    tableBuyBtn.textContent = '已拥有';
                }
                tableBuyBtn.addEventListener('click', function() {
                    if (GameData.isTableUnlocked()) {
                        showToast('你已经拥有桌椅了');
                        return;
                    }
                    var money = GameData.getMoneyCount();
                    if (money < 80) {
                        showToast('金币不足');
                        return;
                    }
                    GameData.addMoneyCount(-80);
                    GameData.unlockTable();
                    tableBuyBtn.disabled = true;
                    tableBuyBtn.textContent = '已拥有';
                    updateAllDisplays();
                    showToast('购买成功！桌椅已放置到花园');
                });
            }

            var birdcageBuyBtn = document.getElementById('birdcage-buy');
            if (birdcageBuyBtn) {
                if (GameData.isBirdCageUnlocked()) {
                    birdcageBuyBtn.disabled = true;
                    birdcageBuyBtn.textContent = '已拥有';
                }
                birdcageBuyBtn.addEventListener('click', function() {
                    if (GameData.isBirdCageUnlocked()) {
                        showToast('你已经拥有鸟笼了');
                        return;
                    }
                    var money = GameData.getMoneyCount();
                    if (money < 50) {
                        showToast('金币不足');
                        return;
                    }
                    GameData.addMoneyCount(-50);
                    GameData.unlockBirdCage();
                    birdcageBuyBtn.disabled = true;
                    birdcageBuyBtn.textContent = '已拥有';
                    updateAllDisplays();
                    showToast('购买成功！鸟笼已放置到花园');
                });
            }

            var poolBuyBtn = document.getElementById('pool-buy');
            if (poolBuyBtn) {
                if (GameData.isPoolUnlocked()) {
                    poolBuyBtn.disabled = true;
                    poolBuyBtn.textContent = '已拥有';
                }
                poolBuyBtn.addEventListener('click', function() {
                    if (GameData.isPoolUnlocked()) {
                        showToast('你已经拥有水池了');
                        return;
                    }
                    var money = GameData.getMoneyCount();
                    if (money < 100) {
                        showToast('金币不足');
                        return;
                    }
                    GameData.addMoneyCount(-100);
                    GameData.unlockPool();
                    poolBuyBtn.disabled = true;
                    poolBuyBtn.textContent = '已拥有';
                    updateAllDisplays();
                    showToast('购买成功！水池已放置到花园');
                });
            }
        }

        window.addEventListener('load', function() {
            initShop();
            updateAllDisplays();
        });
    </script>
</body>
</html>
