<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>工坊</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        #game-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #counter-btn {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 1000;
            background: white;
            color: black;
            border: none;
            border-radius: 50px;
            padding: 6px 14px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 5px;
        }
        #counter-btn .icon {
            font-size: 10px;
        }
        #fertilizer-btn {
            position: fixed;
            top: 50px;
            left: 15px;
            z-index: 1000;
            background: white;
            color: black;
            border: none;
            border-radius: 50px;
            padding: 6px 14px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 5px;
        }
        #fertilizer-btn .icon {
            width: 16px;
            height: 16px;
        }
        #seed-btn {
            position: fixed;
            top: 85px;
            left: 15px;
            z-index: 1000;
            background: white;
            color: black;
            border: none;
            border-radius: 50px;
            padding: 6px 14px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 5px;
        }
        #seed-btn .icon {
            width: 16px;
            height: 16px;
        }
        #money-btn {
            position: fixed;
            top: 120px;
            left: 15px;
            z-index: 1000;
            background: white;
            color: black;
            border: none;
            border-radius: 50px;
            padding: 6px 14px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 5px;
        }
        #money-btn .icon {
            width: 16px;
            height: 16px;
        }
        .nav-btn {
            position: fixed;
            bottom: 20px;
            z-index: 1000;
            background: white;
            color: black;
            border: none;
            border-radius: 50px;
            padding: 6px 10px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            text-decoration: none;
        }
        #nav-garden {
            left: 15px;
        }
    </style>
</head>
<body>
    <button id="counter-btn">
        <span class="icon">🌿</span>
        <span id="counter-text">杂草: 0</span>
    </button>
    <button id="fertilizer-btn">
        <img class="icon" src="./img/tools/fertilizer.png" alt="肥料">
        <span id="fertilizer-text">肥料: 0</span>
    </button>
    <button id="seed-btn">
        <img class="icon" src="./img/tools/随机种子.png" alt="种子">
        <span id="seed-text">种子: 0</span>
    </button>
    <button id="money-btn">
        <img class="icon" src="./img/tools/money.png" alt="货币">
        <span id="money-text">货币: 0</span>
    </button>
    <a href="././garden.html" id="nav-garden" class="nav-btn">前往花园</a>
    <div id="game-container"></div>
    <script src="./phaserjs/phaser.js"></script>
    <script src="./js/core/gameData.js"></script>
    <script src="./js/core/toolbar.js"></script>
    <script src="./js/plants/grass.js"></script>
    <script src="./js/tools/fertilizer.js"></script>
    <script src="./js/furniture/compostbin.js"></script>
    <script src="./js/bills/grass_bill.js"></script>
    <script src="./js/furniture/flowerbox.js"></script>
    <script src="./js/furniture/pc.js"></script>
    <script src="./js/scenes/game-work.js"></script>
    <script>
        window.addEventListener('load', function() {
            initGrassDisplay();
            updateSeedDisplay();
        });
    </script>
</body>
</html>
